name: Publish release

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: "Environment in which to execute the release process"
      scope-override:
        type: string
        description: "Manually specify release scope as <pkg>/v<version>"
jobs:
  extract-params:
    name: Determine release parameters
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      publish-env: ${{ steps.setenv.outputs.envname }}
      version: ${{ steps.getrelease.outputs.version }}
      package: ${{ steps.getrelease.outputs.package }}
      wheel: ${{ steps.getrelease.outputs.wheel }}
    steps:
      - id: setenv
        run: |
          if [[ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]]; then
              echo "envname=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          else
              echo "Cannot run release workflow for trigger event $GITHUB_EVENT_NAME"
              exit 1
          fi
          cat "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get package and version information
        id: getrelease
        run: |
          set -eo pipefail

          if [[ -n "$SCOPE_OVERRIDE" ]]; then
            SCOPE=$SCOPE_OVERRIDE
          elif [[ "${GITHUB_REF:0:10}" == 'refs/tags/' ]]; then
            SCOPE=${GITHUB_REF:10}
          else
            echo "$GITHUB_REF is not a tag, must specify 'scope-override'"
            exit 1
          fi

          FULL_REGEX="\([a-z-]\+\)/v\(.\+\)"
          VER_ONLY_REGEX="v\(.\+\)"

          if echo $SCOPE | grep -q "$FULL_REGEX"; then
            echo $SCOPE \
              | sed "s|$FULL_REGEX|package=\1\nversion=\2|" \
              >> "$GITHUB_OUTPUT"
            echo $SCOPE \
              | sed "s|$FULL_REGEX|wheel=\1|" \
              | tr '-' '_' \
              >> "$GITHUB_OUTPUT"
          elif echo $SCOPE | grep -q "$VER_ONLY_REGEX"; then
            # Default: package = pyhanko
            echo "package=pyhanko" >> "$GITHUB_OUTPUT"
            echo "wheel=pyhanko" >> "$GITHUB_OUTPUT"
            echo $SCOPE \
              | sed "s|$VER_ONLY_REGEX|version=\1|" \
              >> "$GITHUB_OUTPUT"
          else
            echo "Scope $SCOPE does not follow <pkg>/v<version> pattern"
            exit 1
          fi

        env:
          SCOPE_OVERRIDE: ${{ inputs.scope-override }}
      - name: Generate release body
        run: |
          sed "s/:VERSION/$VERSION/g" < .github/gh-release-template-$PACKAGE.md > release.md
          cat release.md
        env:
          VERSION: ${{ steps.getrelease.outputs.version }}
          PACKAGE: ${{ steps.getrelease.outputs.package }}
      - name: Upload release body
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-body
          path: release.md
  verify-ci:
    name: Verify CI checks
    needs: [extract-params]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check CI workflow status for current commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail

          check_workflow() {
            local workflow=$1
            local conclusion
            conclusion=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$workflow" \
              --commit "$GITHUB_SHA" \
              --status completed \
              --json conclusion \
              --limit 1 \
              --jq '.[0].conclusion // "not_found"')
            if [[ "$conclusion" == "success" ]]; then
              echo "  PASS: $workflow"
            else
              echo "  FAIL: $workflow (conclusion: $conclusion)"
              return 1
            fi
          }

          FAILED=0
          check_workflow "build-pipeline.yml" || FAILED=1
          check_workflow "static-analysis.yml" || FAILED=1

          if [[ $FAILED -ne 0 ]]; then
            echo "One or more CI workflows did not pass for commit $GITHUB_SHA"
            exit 1
          fi
          echo "All required CI workflows passed for commit $GITHUB_SHA"

  build:
    needs: [extract-params, verify-ci]
    name: Build release artifacts
    uses: MatthiasValvekens/pyHanko/.github/workflows/package.yml@master
    permissions:
      actions: write
      contents: read
      # required for the build provenance attestation minted in package.yml
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      package: ${{ needs.extract-params.outputs.package }}
      wheel: ${{ needs.extract-params.outputs.wheel }}
      version: ${{ needs.extract-params.outputs.version }}
      environment: build-${{ needs.extract-params.outputs.publish-env }}
  provenance-sanity-check:
    name: Provenance sanity check
    needs: [build, extract-params]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out sources for provenance verification
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyhanko-release-dist
          path: dist/
      - name: Download provenance data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyhanko-provenance
          path: provenance/
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Install provenance-check tooling
        run: uv sync --group provenance-check
      - name: Verify consistency of build provenance of downloaded artifacts
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
          BUILD_ENV: build-${{ needs.extract-params.outputs.publish-env }}
        run: |
          set -eo pipefail
          for artifact in dist/*.whl dist/*.tar.gz; do
            uv run dev/attest_provenance.py "$artifact" \
              --source-ref "$SOURCE_REF" \
              --environment "$BUILD_ENV" \
              --bundle provenance/provenance.sigstore.json
          done
  publish:
    name: Publish release artifacts
    needs: [extract-params, build, provenance-sanity-check]
    runs-on: ubuntu-latest
    environment: ${{ needs.extract-params.outputs.publish-env }}
    permissions:
      # we use PyPI's trusted publisher model -> expose identity token
      id-token: write
      contents: read
      actions: read
    steps:
    - name: Download dist artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: pyhanko-release-dist
        path: dist/
    - name: Download release body
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-body
        path: release-body
    - name: Upload to PyPI
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
      with:
        repository-url: ${{ vars.REPOSITORY_URL }}
  publish-github-release:
    name: Create GitHub release
    needs: [extract-params, publish]
    runs-on: ubuntu-latest
    if: needs.extract-params.outputs.publish-env == 'release' && startsWith(github.ref, 'refs/tags/')
    permissions:
      # we want to add the provenance bundle to the release on GitHub
      contents: write
      discussions: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyhanko-release-dist
          path: dist/
      - name: Download provenance data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pyhanko-provenance
          path: provenance/
      - name: Download release body
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-body
          path: release-body
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            provenance/provenance.sigstore.json
          body_path: release-body/release.md
          fail_on_unmatched_files: true
          discussion_category_name: Announcements
          prerelease: true
          name: ${{ needs.extract-params.outputs.package }} ${{ needs.extract-params.outputs.version }} beta
