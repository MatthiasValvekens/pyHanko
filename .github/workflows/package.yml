name: Package flow

on:
  workflow_call:
    inputs:
      package:
        type: string
        description: "package being released (subdir of pkgs/)"
      wheel:
        type: string
        description: "wheel being released"
      version:
        type: string
        description: "version to release"
      environment:
        type: string
        description: "environment to release in"
permissions:
  actions: read
  contents: read
env:
  UV_NO_MANAGED_PYTHON: 1

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      # provenance attestations are signed using the workflow's OIDC identity
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install build tools
        run: uv sync --group release
      - name: Apply package version for release
        if: inputs.package != ''
        run: |
          uv run python dev/apply_version.py ${{ inputs.package }} ${{ inputs.version }}
          git diff
      - name: Build release wheels
        run: uv build --all-packages --wheel
      - name: Include internal testing commons in sdist for pyhanko & pyhanko-cli
        run: |
          uv run python dev/include_pyhanko_testing_commons.py
          git diff
      - name: Build release sdists
        run: uv build --all-packages --sdist
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyhanko-dist
          path: dist/
      - name: Attest build provenance
        # Attesting here rather than in the calling workflow keeps provenance
        # generation inside a reusable workflow, which is what allows the
        # resulting attestation to be verified against a pinned signer workflow.
        if: inputs.package != ''
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ inputs.wheel }}-${{ inputs.version }}*
      - name: Stage provenance bundle under a stable name
        if: inputs.package != ''
        run: cp "$BUNDLE_PATH" provenance.sigstore.json
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
      - name: Upload provenance bundle
        if: inputs.package != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyhanko-provenance
          path: provenance.sigstore.json
      - name: Upload dist artifacts for release
        if: inputs.package != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyhanko-release-dist
          path: dist/${{ inputs.wheel }}-${{ inputs.version }}*
